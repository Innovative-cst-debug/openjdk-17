name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target_arch: [arm64, arm, x86, x86_64]
    env:
      NDK_VERSION: r26d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build for all architectures
        run: |
          chmod +x *.sh
          ./build-openjdk-17.sh ${{ matrix.target_arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_arch }}-artifact
          path: |
            build/arm/install
